# Step 5c-i: configs/step5b_convnextv2_tiny.yaml + label smoothing 0.1.
name: step5c1_label_smoothing
seed: 0
data:
  root: data
  val_fraction: 0.2
  img_size: 224
  gray3: true
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
  num_workers: 4
  augment:
    rotation: 10
    random_resized_crop:
    - 0.7
    - 1.0
    hflip: 0.5
    brightness: 0.2
    contrast: 0.2
model:
  name: convnext_tiny
  version: v2
  drop_path: 0.1
train:
  optimizer: adamw
  lr: 0.001
  backbone_lr: 0.0001
  weight_decay: 0.05
  batch_size: 64
  epochs: 30
  scheduler: cosine
  warmup_epochs: 2
  label_smoothing: 0.1
