# Step 3a — Step 2b-ii with RGB input instead of grayscale. Note: only Flower images are in color.
name: step3a_rgb
seed: 0

data:
  root: data
  val_fraction: 0.20
  img_size: 64
  grayscale: false
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]
  num_workers: 2
  augment:
    random_resized_crop: [0.7, 1.0]   # keep 70–100% of the image area
    hflip: 0.5
    rotation: 10                      # degrees, ±
    brightness: 0.2
    contrast: 0.2

model:
  name: scenecnn
  in_channels: 3
  widths: [32, 64, 128, 256]
  dropout: 0.3

train:
  optimizer: adam
  lr: 0.002
  batch_size: 64
  epochs: 60
  scheduler: cosine
