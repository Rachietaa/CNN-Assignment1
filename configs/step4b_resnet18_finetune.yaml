# Step 4b — ImageNet-pretrained ResNet-18, FULL fine-tuning (all layers). Differs from 4a only in model/optimizer.
# Pretrained: torchvision ResNet18_Weights.IMAGENET1K_V1 (supervised, ImageNet-1k).
name: step4b_resnet18_finetune
seed: 0

data:
  root: data
  val_fraction: 0.20
  img_size: 224                       # ImageNet training resolution
  gray3: true                         # gray copied into 3 channels (no Flower color shortcut, see Step 3a)
  mean: [0.485, 0.456, 0.406]         # ImageNet normalization
  std: [0.229, 0.224, 0.225]
  num_workers: 4
  augment:                            # same augmentation as Step 2b-ii
    rotation: 10
    random_resized_crop: [0.7, 1.0]
    hflip: 0.5
    brightness: 0.2
    contrast: 0.2

model:
  name: resnet18
  freeze_backbone: false

train:
  optimizer: adamw
  lr: 0.001                           # new final layer
  backbone_lr: 0.0001                 # pretrained layers: 10× smaller
  weight_decay: 0.05
  batch_size: 64
  epochs: 30
  scheduler: cosine
  warmup_epochs: 2
